<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#2a2118;--mute:#7a6c5a;--acc:#8a5a1f;--acc-ink:#fff;--line:#e6dcc8}
@media (prefers-color-scheme:dark){:root{--bg:#17130e;--card:#221c14;--ink:#f1e8d8;--mute:#a89a84;--acc:#d9a35a;--acc-ink:#1a1209;--line:#392f21}}
html{overflow-x:hidden}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:"Frank Ruhl Libre","David","Times New Roman",serif;line-height:1.65;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;padding:24px 0 8px}
h1{font-size:1.6rem;margin:6px 0 0;color:var(--acc)}
.logo{display:block;margin:0 auto;width:auto;max-width:78%;height:auto;max-height:170px;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){.logo{mix-blend-mode:normal;background:#fff;border-radius:18px;padding:8px}}
#install{margin-top:10px;text-align:center}#install .btn{margin-top:0}
.ui,.meta,.msg,label,.btn,input,textarea,.chip,summary,footer button,.tag{font-family:var(--ui)}
.sub{color:var(--mute);margin:4px 0 0;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.card h2{margin:0;font-size:1.35rem}
.tag{display:inline-block;font-weight:600;font-size:.75rem;background:var(--acc);color:var(--acc-ink);padding:2px 10px;border-radius:99px;margin-bottom:6px}
.meta{color:var(--mute);font-size:.85rem}
.btn{display:inline-block;background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;margin-top:10px}
.btn.sm{padding:6px 12px;font-size:.85rem;margin:0}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 16px;font-size:.95rem;cursor:pointer}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
#q{margin-top:10px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:.95rem}
.desc{margin-top:8px}.desc p{margin:.5em 0}.desc h4{margin:1em 0 .2em;color:var(--acc);font-size:1.05rem}.desc ul{margin:.4em 0;padding-inline-start:1.3em}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.actions .btn{margin-top:0}
.del{background:none;border:0;color:#b3402f;font-size:1.1rem;cursor:pointer}
input[type=text],input[type=date],input[type=email],textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem}
textarea{min-height:170px;line-height:1.5}
input[type=file]{margin:8px 0;max-width:100%}
label{font-weight:600;font-size:.85rem;color:var(--mute);display:block;margin-top:8px}
.admin{border-style:dashed}
.admin h3{margin:0 0 4px;font-size:1.1rem}
.msg{font-size:.9rem;color:var(--mute);margin-top:8px}
.hint{font:.8rem var(--ui);color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:20px 0}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font:.9rem var(--ui)}
.arow span{flex:1;direction:ltr;text-align:right}.arow>span:first-child{flex:1 1 260px;min-width:0}.arow>span.meta{flex:0 0 auto}
.pv img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#fff;min-height:120px}
select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-family:var(--ui);margin:6px 0}
mark{background:#ffe08a;color:#2a2118;border-radius:3px;padding:0 1px}
.warn{font:.8rem var(--ui);color:#b3402f}
input[type=search]{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem;font-family:var(--ui)}
input[type=number]{padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem;font-family:var(--ui);box-sizing:border-box}
.art{background:rgba(190,150,60,.13);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:.95rem}
footer{text-align:center;margin-top:20px}
.ver{font:.7rem var(--ui);color:var(--mute);opacity:.7;margin-top:6px;direction:ltr}
footer a{color:var(--mute);font:.8rem var(--ui);text-decoration:none}
footer button{background:none;border:0;color:var(--mute);font-size:.8rem;cursor:pointer}
[hidden]{display:none!important}
select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem;font-family:var(--ui)}
.glabel{font:600 .85rem var(--ui);color:var(--mute);margin:14px 0 6px}
.pres{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:2px 10px 8px;background:var(--card);margin-top:6px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}.pchips .chip{padding:4px 12px;font-size:.88rem}.chip.dim{opacity:.4}
.srow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.srow .st{flex:1;min-width:0;font:.92rem var(--ui)}.used{font:.78rem var(--ui);color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.langs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.langs button{font:.8rem var(--ui);background:none;border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:3px 12px;cursor:pointer}
.langs button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.langs select{width:auto;font:.8rem var(--ui);background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:3px 12px;cursor:pointer}
.contact{text-align:center;margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--ui)}
.contact h3{margin:0 0 8px;font-size:1rem;color:var(--acc)}
.contact a,.contact span{display:inline-block;margin:3px 10px;color:var(--ink);text-decoration:none;font-size:.95rem}
.contact a:hover{color:var(--acc)}
a.lnk{color:var(--acc);text-decoration:underline;text-underline-offset:2px;cursor:pointer}a.lnk:hover{opacity:.8}

/* ===== תצוגה מכווצת + אקורדיון ===== */
.card{padding:12px 14px;margin-top:10px}
.card h2{font-size:1.15rem}
.acc{padding:0}
.acc>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;list-style:none;padding:11px 14px;cursor:pointer;color:var(--ink);font-weight:400}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"▾";color:var(--acc);flex:none}
.acc[open]>summary::after{content:"▴"}
.acc>summary .sh{flex:1;min-width:0}
.acc>summary h2{display:inline;font-size:1.05rem;margin:0}
.acc>summary .meta{display:block}
.acc>summary .tag{margin-bottom:2px}
.acc>.accbody{padding:6px 14px 12px;border-top:1px solid var(--line)}
.yzp{border-bottom:1px solid var(--line)}
.yzp>summary{padding:7px 0;font-size:.95rem;font-weight:400;color:var(--ink)}
details details,.accbody details{margin-top:8px;padding-top:6px}
.srcd>summary{font-size:.9rem}
</style>

</head>
